[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-spatial-kit"
version = "0.1.0"
description = "Offline indexing, spatial previews, and mc-builder blueprint export for Minecraft Java worlds"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "nbtlib==2.0.4",
    "numpy>=1.23,<3",
    "Pillow>=10,<13",
    "trimesh>=4,<5",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
mc-spatial = "minecraft_spatial.cli:main"

[tool.setuptools]
packages = ["minecraft_spatial"]

[tool.pytest.ini_options]
testpaths = ["tests"]
